# MiniGreat-Sender Docker Compose 示例
# 用于开发/调试场景。硬件协议(串口/SPI/I2C/CAN/BLE)需要宿主设备透传:
#   - 串口/SPI/I2C: 需要挂载 /dev 或具体设备节点
#   - CAN: 需要 network_mode: host 访问 can0/vcan0
#   - BLE: 需要挂载宿主 D-Bus (HostNetwork 下访问 /run/dbus)
#
# 启动 Web 面板:  docker compose up -d sender-web
# 进容器调试:    docker compose run --rm sender /bin/sh
services:
  sender-web:
    image: minigreat-sender:latest
    build:
      context: .
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    container_name: minigreat-sender
    # 硬件访问需要 host 网络 + 特权模式
    network_mode: host
    privileged: true
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/spidev0.0:/dev/spidev0.0
      - /dev/spidev0.1:/dev/spidev0.1
      - /dev/i2c-1:/dev/i2c-1
    volumes:
      - /run/dbus:/run/dbus:ro   # BLE BlueZ D-Bus
      - /var/run/bluetooth:/var/run/bluetooth:ro
      - ./config:/app/config:ro  # 可挂载自定义配置
    command: ["web", "--addr", "0.0.0.0:8080"]
    restart: unless-stopped